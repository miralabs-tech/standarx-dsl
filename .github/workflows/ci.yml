name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  no-default-features:
    name: build + test standarx-dsl --no-default-features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p standarx-dsl --no-default-features
      - run: cargo test -p standarx-dsl --no-default-features

  docs:
    name: cargo doc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --workspace

  fuzz-build:
    name: fuzz target compile check (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz build
        working-directory: fuzz

  tree-sitter:
    name: tree-sitter grammar (generate + test + drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install tree-sitter-cli
        run: bun install
        working-directory: tree-sitter-standarx
      - name: Generate parser
        run: bunx tree-sitter generate
        working-directory: tree-sitter-standarx
      - name: Run corpus tests
        run: bunx tree-sitter test
        working-directory: tree-sitter-standarx
      - name: Assert no drift vs versioned src/
        run: |
          if ! git diff --quiet -- tree-sitter-standarx/src; then
            echo "::error::tree-sitter-standarx/src is out of date."
            echo "Run 'cd tree-sitter-standarx && bunx tree-sitter generate' and commit the result."
            git --no-pager diff -- tree-sitter-standarx/src
            exit 1
          fi

  msrv:
    name: build (MSRV 1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features

  grammar-drift:
    name: grammar dist up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate dist/
        run: |
          cargo run -p standarx-dsl-grammar --bin standarx-grammar-gen -- \
            --out-dir crates/standarx-dsl-grammar/dist
      - name: Assert no drift vs versioned dist
        run: |
          if ! git diff --quiet -- crates/standarx-dsl-grammar/dist; then
            echo "::error::crates/standarx-dsl-grammar/dist is out of date."
            echo "Run 'cargo run -p standarx-dsl-grammar --bin standarx-grammar-gen -- --out-dir crates/standarx-dsl-grammar/dist' and commit the result."
            git --no-pager diff -- crates/standarx-dsl-grammar/dist
            exit 1
          fi
