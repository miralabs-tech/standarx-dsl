[workspace]
resolver = "2"
members = ["crates/*"]
# `fuzz/` is a cargo-fuzz sub-crate with its own workspace root —
# it pulls in libfuzzer-sys (nightly-only, Linux/macOS) and must
# stay out of the main workspace so stable cargo doesn't trip over
# it. Run fuzz targets via `cargo +nightly fuzz run <target>` from
# the workspace root; cargo-fuzz auto-detects `fuzz/`.
exclude = ["fuzz"]

# `version` is intentionally NOT shared at the workspace level — each
# crate manages its own pace. `standarx-dsl` is at 1.0 (frozen public
# contract); the editor-integration crates stay 0.1.x while their
# surface is still moving.
[workspace.package]
edition = "2021"
authors = ["miralabs-tech"]
license = "MIT"
repository = "https://github.com/miralabs-tech/standarx-dsl"
homepage = "https://github.com/miralabs-tech/standarx-dsl"
rust-version = "1.95"

[workspace.dependencies]
standarx-dsl = { version = "1.0.0", path = "crates/standarx-dsl" }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
proptest = "1"
