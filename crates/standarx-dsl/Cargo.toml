[package]
name = "standarx-dsl"
version = "1.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Reusable DSL parser for the standar* ecosystem (lexer + parser + AST). Used by standarbuild for .sxb (tasks) and standardoc for .sxd (workspace config)."
keywords = ["dsl", "parser", "lexer", "config", "standarx"]
categories = ["parser-implementations", "config"]

[features]
default = ["serde"]
# Derives `serde::Serialize` on every public AST/Diag type and a
# transparent forwarding impl on `Spanned<T>`. Opt out with
# `default-features = false` for a leaner build.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
